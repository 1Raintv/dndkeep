name: CI Gate

# Encodes THE GATE from docs/ROADMAP.md on every push:
#   1. TypeScript error count must not RISE above the carried baseline
#      (TS_BASELINE below — the single source of truth for this number).
#      This is a threshold check, not fail-on-any-error — the baseline is
#      known debt. TS2304 (cannot find name) must be exactly 0.
#   2. eslint rules-of-hooks must be clean (React error #310 class).
#   3. Production build must succeed.
# Uses the project-pinned TypeScript (NOT npx tsc — a global TS 6.x errors
# on the deprecated baseUrl option and halts before type-checking).

on:
  push:
    branches: ["**"]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * *"  # daily RAW regression sweep

env:
  # Ratcheted down as debt is paid: 271 → 267 → 222 (2026-08-03 audit
  # dead-code removal + dice consolidation). Lower freely, never raise.
  TS_BASELINE: 221

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (fresh — gets correct linux natives)
        run: npm ci

      - name: Verify release gate
        run: npm run verify
