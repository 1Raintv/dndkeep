name: Apply Migrations

# v2.649 — applies supabase/migrations/ to the tier matching the branch:
#
#   push to `test` → TEST database   (secret SUPABASE_DB_URL_TEST)
#   push to `main` → PROD database   (secret SUPABASE_DB_URL)
#
# Each tier is a no-op until its secret exists — the gate step skips
# cleanly with a notice. For PROD that gate is a hard safety interlock:
#
#   ADD `SUPABASE_DB_URL` ONLY AFTER THE ONE-TIME LEDGER BASELINE.
#
# Prod's schema predates most of the migration chain; until the baseline
# marks historical files as applied in prod's schema_migrations ledger,
# an unbaselined `db push` would try to replay all ~150 files. Sequence
# and rationale: owner queue in .claude/audit/dndkeep-audit.md. The TEST
# project has no such constraint — it was born empty, so its first push
# replays the whole chain by design.
#
# Once enabled: `db push` consults the target's schema_migrations ledger
# and applies ONLY never-run files, in order — re-running is a no-op.
# New migrations are also written idempotent (IF NOT EXISTS) as a
# seatbelt per the 2026-08-04 convention. Local dev stays on the
# /apply-migrations skill (Docker DB).

on:
  push:
    branches: [main, test]
    paths: ['supabase/migrations/**']
  workflow_dispatch: {}   # applies to the tier of whichever ref you dispatch on

# Never let two pushes race the same ledger; test and prod may run
# concurrently with each other (different databases).
concurrency:
  group: migrate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    # First test-DB run replays the full ~150-file chain (incl. spell
    # seed data) — allow more than the usual couple of minutes.
    timeout-minutes: 20
    env:
      TIER: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
      # Selected in the gate step, NOT via `a && b || c` here: that GitHub
      # expression falls through on EMPTY (not on branch), so main with an
      # unset prod secret would silently target the test DB.
      DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL }}
      DB_URL_TEST: ${{ secrets.SUPABASE_DB_URL_TEST }}
    steps:
      - name: Gate — skip cleanly until this tier's secret exists
        id: gate
        run: |
          if [ "$TIER" = "prod" ]; then
            SUPABASE_DB_URL="$DB_URL_PROD"
          else
            SUPABASE_DB_URL="$DB_URL_TEST"
          fi
          echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV"
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ "$TIER" = "prod" ]; then
              echo "::notice::SUPABASE_DB_URL not set — PROD migration apply SKIPPED. Enable only after the ledger baseline (owner queue)."
            else
              echo "::notice::SUPABASE_DB_URL_TEST not set — TEST migration apply SKIPPED. Create the test Supabase project and add the secret."
            fi
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Applying migrations to the ${TIER^^} database."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: latest

      - name: Dry run (log what WOULD apply)
        if: steps.gate.outputs.enabled == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply pending migrations
        if: steps.gate.outputs.enabled == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
